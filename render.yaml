services:
  - type: web
    name: legal-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python build_indices.py
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRY_HOURS
        value: 24
      - key: UPLOAD_TTL_MINUTES
        value: 60
